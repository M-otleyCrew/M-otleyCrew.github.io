name: Academy checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build static lessons
        run: node scripts/build-course.cjs
      - name: Check content, links and progress compatibility
        run: node scripts/check-course.cjs
      - name: Verify generated files are current
        run: git diff --exit-code -- fortinet-academy
